name: Publicar en GitHub Pages (PRO = main · UAT = develop)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (PRO)
        uses: actions/checkout@v4
        with:
          ref: main
          path: pro

      - name: Checkout develop (UAT)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: uat

      - name: Montar el sitio
        run: |
          set -euo pipefail
          mkdir -p _site
          # PRO en la raíz
          rsync -a --exclude .git --exclude .github --exclude docs \
                --exclude CLAUDE.md --exclude README.md --exclude .gitignore \
                --exclude .claude --exclude package.json \
                pro/ _site/
          # UAT colgando de /uat/
          mkdir -p _site/uat
          rsync -a --exclude .git --exclude .github --exclude docs \
                --exclude CLAUDE.md --exclude README.md --exclude .gitignore \
                --exclude .claude --exclude package.json \
                uat/ _site/uat/
          # Distintivo visual solo en UAT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/uat/index.html')
          s = p.read_text(encoding='utf-8')
          badge = (
            '<style>#envbadge{position:fixed;right:10px;bottom:10px;z-index:9999;'
            'font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:1.5px;'
            'background:#C98A00;color:#fff;padding:6px 10px;border-radius:12px;'
            'box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none}</style>'
            '<div id="envbadge">UAT</div>'
          )
          p.write_text(s.replace('</body>', badge + '</body>'), encoding='utf-8')
          PY
          touch _site/.nojekyll
          echo "--- contenido publicado ---"
          find _site -maxdepth 2 -not -path '*/js/*' -not -path '*/css/*' | sort

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
